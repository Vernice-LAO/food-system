學習清單備忘系統:index.html
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>study_list 學習探討與備忘系統</title>
    <!-- 引入 Google Fonts (Noto Sans TC) 與 FontAwesome 圖示 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 日系無印極簡美學變數 - 經現代化精緻微調 */
        :root {
            --bg-color: #f6f3eb;       /* 優雅溫潤的米紙暖白 */
            --card-bg: #ffffff;        /* 純白霧面卡片 */
            --text-main: #2d2a26;      /* 深木炭茶褐 */
            --text-muted: #857c74;     /* 柔和霧面卡其 */
            --border-color: #e5dfd3;   /* 微風暖沙細邊框 */
            --primary: #455560;        /* 沉穩石青藍 */
            --primary-light: #f2f5f7;
            --primary-hover: #34424c;
            --accent-active: #e27d60;  /* 熟成柿子橘 (Active) */
            --accent-done: #739572;    /* 靜謐抹茶綠 (Done) */
            
            /* 經物理渲染計算的擬真投影陰影 */
            --shadow-sm: 0 2px 8px rgba(45, 42, 38, 0.04);
            --shadow: 0 8px 24px rgba(45, 42, 38, 0.06);
            --shadow-hover: 0 16px 36px rgba(45, 42, 38, 0.12);
            --transition-smooth: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background: linear-gradient(180deg, #fbfaf8 0%, var(--bg-color) 100%);
            color: var(--text-main);
            line-height: 1.7;
            padding: 3rem 1.5rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1040px;
            margin: 0 auto;
        }

        /* 標題區域 */
        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--primary);
            letter-spacing: -0.5px;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        header h1 i {
            font-size: 2.2rem;
            color: var(--accent-active);
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* 左右雙欄結構 */
        .layout-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2.5rem;
            animation: fadeInSlide 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @media (min-width: 850px) {
            .layout-grid {
                grid-template-columns: 380px 1fr;
                gap: 3rem;
            }
        }

        /* 卡片統一樣式 - 提升視覺空氣感 */
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            height: fit-content;
            transition: var(--transition-smooth);
        }

        .card:hover {
            box-shadow: var(--shadow-hover);
        }

        .card-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
            letter-spacing: 0.5px;
        }

        /* 表單元素樣式 */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.6rem;
            letter-spacing: 0.2px;
        }

        .form-control {
            width: 100%;
            padding: 0.85rem 1.1rem;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background-color: #fdfdfc;
            font-size: 0.95rem;
            color: var(--text-main);
            transition: var(--transition-smooth);
        }

        .form-control::placeholder {
            color: #b0a8a0;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(69, 85, 96, 0.08);
            transform: translateY(-1px);
        }

        .input-row {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 1rem;
        }

        /* 提交按鈕 */
        .btn-submit {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            color: #ffffff;
            background-color: var(--primary);
            transition: var(--transition-smooth);
            box-shadow: 0 4px 12px rgba(69, 85, 96, 0.15);
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(69, 85, 96, 0.25);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* 右側展示篩選與卡片牆工具列 */
        .toolbar {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            margin-bottom: 1.5rem;
        }

        @media (min-width: 600px) {
            .toolbar {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .toolbar-title {
            font-size: 1.45rem;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.6rem;
            letter-spacing: -0.2px;
        }

        /* 極簡篩選標籤 */
        .filter-tabs {
            display: flex;
            background-color: #eae3d7;
            padding: 0.35rem;
            border-radius: 30px;
            gap: 0.25rem;
            align-self: flex-start;
        }

        .filter-tab {
            border: none;
            background: none;
            padding: 0.5rem 1.4rem;
            border-radius: 20px;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            color: var(--text-muted);
            transition: var(--transition-smooth);
        }

        .filter-tab:hover {
            color: var(--text-main);
        }

        .filter-tab.active {
            background-color: var(--card-bg);
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(45, 42, 38, 0.08);
        }

        /* 統計摘要面板樣式 - 優雅現代風 */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stats-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 1.1rem;
            text-align: center;
            box-shadow: var(--shadow-sm);
            transition: var(--transition-smooth);
        }

        .stats-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow);
            border-color: rgba(69, 85, 96, 0.2);
        }

        .stats-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            letter-spacing: 0.3px;
        }

        .stats-value {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--primary);
        }

        @media (max-width: 480px) {
            .stats-container {
                grid-template-columns: 1fr;
                gap: 0.75rem;
            }
        }

        /* 新增：進階數據視覺化儀表板樣式 */
        .visual-dashboard {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-sm);
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            transition: var(--transition-smooth);
        }

        @media (min-width: 580px) {
            .visual-dashboard {
                grid-template-columns: 120px 1fr;
                align-items: center;
            }
        }

        .visual-dashboard:hover {
            box-shadow: var(--shadow);
            border-color: rgba(69, 85, 96, 0.15);
        }

        /* 圓環進度條結構 */
        .chart-ring-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .chart-ring-svg {
            transform: rotate(-90deg);
        }

        .chart-ring-bg {
            fill: none;
            stroke: #f3eee3;
            stroke-width: 8;
        }

        .chart-ring-progress {
            fill: none;
            stroke: var(--accent-done);
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .chart-ring-text {
            position: absolute;
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .chart-ring-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: -2px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* 優先級能量條圖表 */
        .bar-chart-container {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .bar-chart-title {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.2rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            letter-spacing: 0.2px;
        }

        .bar-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .bar-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .bar-track {
            height: 10px;
            background-color: #f3eee3;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            border-radius: 5px;
            width: 0%;
            transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .bar-fill-high { background-color: var(--accent-active); }
        .bar-fill-medium { background-color: #f5b041; }
        .bar-fill-low { background-color: var(--primary); }

        /* 學習事項卡片展示牆 */
        .records-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 650px) {
            .records-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* 備忘卡片本體 */
        .study-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 1.75rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
            animation: cardEntrance 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .study-card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: var(--shadow);
            border-color: rgba(69, 85, 96, 0.15);
        }

        /* 事項狀態左邊線視覺提示 */
        .study-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            background-color: var(--accent-active);
            transition: var(--transition-smooth);
        }

        .study-card.is-done::before {
            background-color: var(--accent-done);
        }

        /* 卡片頭部：標籤、時間 */
        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
        }

        .tag-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.65rem;
            border-radius: 6px;
            letter-spacing: 0.2px;
            transition: var(--transition-smooth);
        }

        .tag-priority-high { background-color: #ffebeb; color: #b91c1c; }
        .tag-priority-medium { background-color: #fff9db; color: #b26a00; }
        .tag-priority-low { background-color: #ebfbee; color: #1e7e34; }

        .tag-status-active {
            background-color: #fff0ed;
            color: var(--accent-active);
            border: 1px solid rgba(226, 125, 96, 0.2);
        }

        .tag-status-done {
            background-color: #f1f7f1;
            color: var(--accent-done);
            border: 1px dashed rgba(115, 149, 114, 0.3);
        }

        .card-time {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* 核心內文 - 提高對比度與易讀性 */
        .card-body {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 1rem;
            word-break: break-all;
            line-height: 1.6;
        }

        /* 註記 - 細緻簡約的筆記背景 */
        .card-remarks {
            font-size: 0.88rem;
            color: var(--text-muted);
            background-color: #fcfbf9;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            border-left: 3px solid #ded9cb;
            margin-bottom: 1.25rem;
            font-style: italic;
            word-break: break-all;
            line-height: 1.5;
        }

        /* 學習時數資訊 */
        .card-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: auto;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: 700;
        }

        .card-info i {
            color: var(--primary);
            font-size: 1rem;
        }

        /* 底部控制按鈕 */
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
        }

        .btn-action {
            background: none;
            border: 1px solid var(--border-color);
            padding: 0.45rem 1rem;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: var(--transition-smooth);
        }

        .btn-toggle {
            color: var(--primary);
            background-color: #fdfdfc;
        }

        .btn-toggle:hover {
            background-color: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 4px 10px rgba(69, 85, 96, 0.15);
        }

        .btn-delete {
            color: #c62828;
            border: 1px solid rgba(198, 40, 40, 0.1);
            background-color: rgba(198, 40, 40, 0.02);
        }

        .btn-delete:hover {
            background-color: #ffebee;
            color: #b71c1c;
            border-color: #ffcdd2;
            box-shadow: 0 4px 10px rgba(198, 40, 40, 0.1);
        }

        /* 完成狀態 (done) 卡片樣式 */
        .study-card.is-done .card-body {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .study-card.is-done {
            background-color: #f9f9f7;
            opacity: 0.85;
            border-color: #e2dfd7;
        }

        /* 滿版空清單 */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 5rem 2rem;
            color: var(--text-muted);
            background-color: var(--card-bg);
            border-radius: 16px;
            border: 2px dashed var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1.25rem;
            opacity: 0.7;
            color: var(--primary);
            display: block;
            animation: pulse 2s infinite ease-in-out;
        }

        /* 彈出訊息提示 - Toast 精美動畫與排版 */
        .toast {
            position: fixed;
            bottom: 2.5rem;
            right: 2.5rem;
            background-color: var(--primary);
            color: #ffffff;
            padding: 0.9rem 1.75rem;
            border-radius: 10px;
            box-shadow: 0 12px 32px rgba(45, 42, 38, 0.2);
            z-index: 1000;
            display: none;
            animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            font-weight: 700;
            font-size: 0.92rem;
            letter-spacing: 0.5px;
        }

        /* KEYFRAMES 動畫 */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInSlide {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes slideIn {
            from { transform: translateY(2rem); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 標頭 -->
        <header>
            <h1><i class="fa-solid fa-graduation-cap"></i> study_list</h1>
            <p>簡單、專注的學習探討與備考事項備忘小幫手</p>
        </header>

        <!-- 主體網格 -->
        <main class="layout-grid">
            
            <!-- 左欄：研習事項新增表單 -->
            <section class="card">
                <div class="card-title">
                    <i class="fa-solid fa-feather-pointed" style="color: var(--accent-active);"></i> 記下研習任務
                </div>
                <form id="studyForm" novalidate>
                    
                    <!-- 1. waiting to do (必填) -->
                    <div class="form-group">
                        <label for="inputWaiting">學習備忘事項 * (waiting to do)</label>
                        <input type="text" id="inputWaiting" class="form-control" placeholder="例：詳讀 React Hooks 原始碼並手寫筆記" required autocomplete="off">
                    </div>

                    <!-- 2. 學習優先權 & 預估時間 -->
                    <div class="form-group">
                        <div class="input-row">
                            <div>
                                <label for="selectPriority">優先權 *</label>
                                <select id="selectPriority" class="form-control" required>
                                    <option value="high">🔥 高</option>
                                    <option value="medium" selected>⚡ 中</option>
                                    <option value="low">🌱 低</option>
                                </select>
                            </div>
                            <div>
                                <label for="inputHours">預估時數 (小時) *</label>
                                <input type="number" id="inputHours" class="form-control" min="1" max="100" value="2" required>
                            </div>
                        </div>
                    </div>

                    <!-- 3. 補充說明 -->
                    <div class="form-group">
                        <label for="inputRemarks">補充註記與吐槽 (選填)</label>
                        <textarea id="inputRemarks" class="form-control" style="resize: vertical; min-height: 80px;" placeholder="例：希望下午前能徹底看懂，別再分心滑手機了！"></textarea>
                    </div>

                    <!-- 提交按鈕 -->
                    <button type="submit" class="btn-submit">
                        <i class="fa-solid fa-folder-plus"></i> 新增研習事項
                    </button>
                </form>
            </section>

            <!-- 右欄：景點備忘卡片牆 -->
            <section style="display: flex; flex-direction: column;">
                
                <!-- 篩選控制列 -->
                <div class="toolbar">
                    <div class="toolbar-title">
                        <i class="fa-solid fa-book-open" style="color: var(--primary);"></i> 研習清單
                    </div>
                    <div class="filter-tabs" id="filterTabs">
                        <button class="filter-tab active" data-filter="all">全部</button>
                        <button class="filter-tab" data-filter="active">研習中</button>
                        <button class="filter-tab" data-filter="done">已修得</button>
                    </div>
                </div>

                <!-- 統計摘要面板 -->
                <div id="statsSummary" class="stats-container">
                    <!-- 由 updateSummary() 動態載入 -->
                </div>

                <!-- 新增：進階數據視覺化儀表板 -->
                <div id="visualDashboard" class="visual-dashboard">
                    <!-- 由 updateSummary() 動態載入 -->
                </div>

                <!-- 備忘卡片牆 -->
                <div id="recordsContainer" class="records-grid">
                    <!-- 由 JavaScript 動態繪製 -->
                </div>
            </section>

        </main>
    </div>

    <!-- 提示框 -->
    <div id="toast" class="toast"></div>

    <script>
        // ==========================================
        //  後端連接器 (Backend Connector Config)
        // ==========================================
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzdI5irWnz5g4WLnt76xRO768iUZYXT8R_zXfmLrDCJFa35MdUOVbUsIfFbei_w3TVj/exec";

        // --- 全域變數狀態管制 ---
        let currentFilter = 'all';

        // 頁面初次載入
        document.addEventListener('DOMContentLoaded', () => {
            initApp();
        });

        // 初始化系統元件 (結合雲端載入與離線 Fallback 檢查)
        async function initApp() {
            showToast("⏳ 正在與雲端資料庫同步中...");
            
            // 優先從 Google Sheet API 取得最新資料
            const records = await fetchRecordsFromSheet();
            renderList(records);

            // 監聽新增表單
            const form = document.getElementById('studyForm');
            form.addEventListener('submit', onFormSubmit);

            // 監聽篩選按鈕群組
            const filterTabs = document.getElementById('filterTabs');
            filterTabs.addEventListener('click', (e) => {
                if (e.target.classList.contains('filter-tab')) {
                    document.querySelectorAll('.filter-tab').forEach(btn => btn.classList.remove('active'));
                    e.target.classList.add('active');

                    currentFilter = e.target.dataset.filter;
                    applyFilter();
                }
            });
        }

        // 當表單提交時
        function onFormSubmit(e) {
            e.preventDefault();

            const waitingInput = document.getElementById('inputWaiting');
            const prioritySelect = document.getElementById('selectPriority');
            const hoursInput = document.getElementById('inputHours');
            const remarksInput = document.getElementById('inputRemarks');

            // 取值與修飾
            const waitingToDo = waitingInput.value.trim();
            const priority = prioritySelect.value;
            const estimatedHours = parseInt(hoursInput.value, 10);
            const remarks = remarksInput.value.trim();

            // 必填欄位驗證
            if (!waitingToDo) {
                showToast('請輸入待辦學習事項內容！');
                waitingInput.focus();
                return;
            }
            if (isNaN(estimatedHours) || estimatedHours < 1) {
                showToast('預估學習時數必須為大於或等於 1 的數字！');
                hoursInput.focus();
                return;
            }

            const formData = {
                waitingToDo: waitingToDo,
                priority: priority,
                estimatedHours: estimatedHours,
                remarks: remarks
            };

            // 依技術要求建立新紀錄
            createRecord(formData);
            
            // 清空表單
            document.getElementById('studyForm').reset();
            document.getElementById('selectPriority').value = 'medium';
            document.getElementById('inputHours').value = '2';
        }


        // ==========================================
        //  後端雲端資料串接與規格化模組
        // ==========================================

        /**
         * 透過 POST 將新增/修改事件即時同步回 Google Sheet 資料庫
         * @param {Object} payload POST 傳送的主體，如 { action: "create", record } 或 { action: "update", record }
         */
        async function syncToSheet(payload) {
            try {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                if (!data.ok) {
                    console.error("同步至 Google Sheet 失敗:", data.error);
                    showToast("⚠️ 同步失敗：" + data.error);
                } else {
                    console.log("雲端同步成功:", data.message);
                }
            } catch (err) {
                console.warn("無法連接至雲端伺服器，已先啟用本地快取:", err);
                showToast("⚠️ 網路連線不穩，已在離線模式為您排隊同步。");
            }
        }

        /**
         * 透過 GET 自 Web App API 取得最新資料並對齊前端欄位
         */
        async function fetchRecordsFromSheet() {
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                const data = await response.json();
                if (data.ok && data.records) {
                    // 對每一筆紀錄進行萬全的鍵名歸一化 (Normalization)
                    const normalized = data.records.map(rec => normalizeRecord(rec));
                    // 同步快取至 localStorage 作為離線備份防護
                    localStorage.setItem('records', JSON.stringify(normalized));
                    showToast("☁️ 雲端同步載入成功！");
                    return normalized;
                }
                throw new Error(data.error || "傳回資料格式異常");
            } catch (err) {
                console.warn("啟用離線備份，載入本機 localStorage:", err);
                showToast("🔌 已自動切換至離線（本地備份）模式");
                return loadData(); // 發生網路連線或 API 故障時自動 Fallback
            }
        }

        /**
         * 確保資料不論從 localStorage 或是從 Google Sheet 的欄位中獲取，鍵名與值型態均維持 frontend contract
         */
        function normalizeRecord(record) {
            return {
                id: record.id || record["系統 ID"] || "",
                createdAt: record.createdAt || record["建立時間"] || new Date().toISOString(),
                status: record.status || record["事項狀態"] || "active",
                waitingToDo: record.waitingToDo || record["待辦學習事項"] || "",
                priority: record.priority || record["優先權"] || "medium",
                estimatedHours: Number(record.estimatedHours || record["預估時數 (小時)"] || 1),
                remarks: record.remarks || record["補充備註"] || ""
            };
        }


        // ==========================================
        //  技術要求：指定規格之核心函數 (嚴格拆分)
        // ==========================================

        /**
         * 1. createRecord(formData)
         * 職責：根據表單內容建立一筆新 record object。
         * @param {Object} formData 包含 waitingToDo, priority, estimatedHours, remarks 的暫存物件
         */
        function createRecord(formData) {
            const uniqueId = 'study_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);

            const newRecord = {
                id: uniqueId,
                createdAt: new Date().toISOString(), // 依規格使用 new Date().toISOString()
                status: 'active', // 預設 active
                waitingToDo: formData.waitingToDo,
                priority: formData.priority,
                estimatedHours: Number(formData.estimatedHours),
                remarks: formData.remarks
            };

            // 先同步至本地快取與畫面渲染，確保操作流暢毫無遲滯
            saveData(newRecord);
            
            // 同步至雲端資料庫
            syncToSheet({ action: "create", record: newRecord });
            
            showToast('🌱 成功加入一筆全新的學習項目！');
        }

        /**
         * 2. saveData(record)
         * 職責：只負責新增一筆 record 到 records array，然後寫入 localStorage。
         * @param {Object} record 單筆待儲存的學習紀錄物件
         */
        function saveData(record) {
            const records = loadData();
            records.push(record);
            localStorage.setItem('records', JSON.stringify(records));

            // 重設篩選為「全部」，確保新增的 Active 項目能立刻在畫面上被看見
            resetFilterToAll();
        }

        /**
         * 3. loadData()
         * 職責：從 localStorage 讀取 records array；沒有資料就回傳 []。
         * @returns {Array} 學習紀錄陣列
         */
        function loadData() {
            const rawData = localStorage.getItem('records');
            try {
                return rawData ? JSON.parse(rawData) : [];
            } catch (err) {
                console.error("讀取歷史儲存檔失敗：", err);
                return [];
            }
        }

        /**
         * 4. renderList(recordsToShow)
         * 職責：接收過濾後的 records 陣列，負責乾淨地渲染到畫面上。
         * @param {Array} recordsToShow 要渲染到畫面的紀錄陣列
         */
        function renderList(recordsToShow) {
            // 即時更新上方統計面板數據與進階視覺化圖表 (根據所有 localStorage 裡的資料統計)
            updateSummary();

            const container = document.getElementById('recordsContainer');
            container.innerHTML = ''; // 清空先前的內容

            // 倘若為空，顯示提示頁面
            if (!recordsToShow || recordsToShow.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="empty-state-icon"><i class="fa-solid fa-mug-hot"></i></span>
                        <h3>當前無研習任務</h3>
                        <p>現在正是放鬆或寫下新一項學習計畫的好時機！</p>
                    </div>
                `;
                return;
            }

            // 排版：新新增的事項顯示在最前方（建立時間降序）
            const sortedRecords = [...recordsToShow].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

            sortedRecords.forEach(record => {
                const card = document.createElement('div');
                card.className = `study-card ${record.status === 'done' ? 'is-done' : ''}`;

                // 優先權與狀態標籤轉換
                const priorityText = record.priority === 'high' ? '高優先度' : record.priority === 'medium' ? '中優先度' : '低優先度';
                
                // 狀態戳章與對應按鈕文字 (XXX_STATUS_DONE_TEXT)
                const statusBadgeHtml = record.status === 'done'
                    ? `<span class="tag tag-status-done"><i class="fa-solid fa-graduation-cap"></i> 🎓 已修得 (Done)</span>`
                    : `<span class="tag tag-status-active"><i class="fa-solid fa-pencil"></i> ✍️ 研習中 (Active)</span>`;

                const toggleBtnText = record.status === 'active'
                    ? '<i class="fa-solid fa-square-check"></i> 標記已完成'
                    : '<i class="fa-solid fa-rotate-left"></i> 恢復 Active';

                // 防止 XSS 攻擊的內容轉換
                const safeWaiting = escapeHtml(record.waitingToDo);
                const safeRemarks = escapeHtml(record.remarks);

                card.innerHTML = `
                    <div class="card-meta">
                        <div class="tag-group">
                            <span class="tag tag-priority-${record.priority}">${priorityText}</span>
                            ${statusBadgeHtml}
                        </div>
                        <span class="card-time">${formatDate(record.createdAt)}</span>
                    </div>

                    <div class="card-body">${safeWaiting}</div>
                    
                    ${record.remarks ? `<div class="card-remarks">${safeRemarks}</div>` : ''}

                    <div class="card-info">
                        <i class="fa-regular fa-clock"></i>
                        <span>預估時數：${record.estimatedHours} 小時</span>
                    </div>

                    <div class="card-footer">
                        <button class="btn-action btn-toggle" onclick="toggleStatus('${record.id}', '${record.status}')">
                            ${toggleBtnText}
                        </button>
                        <button class="btn-action btn-delete" onclick="handleDelete('${record.id}')" title="刪除本筆事項">
                            <i class="fa-solid fa-trash-can"></i> 刪除
                        </button>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        /**
         * 5. updateRecord(id, changes)
         * 職責：更新指定 id 的單筆 record，並重新寫入 localStorage 與 Google Sheet。
         * @param {String} id 唯一識別碼
         * @param {Object} changes 包含要修改鍵值的變更對象
         */
        function updateRecord(id, changes) {
            const records = loadData();
            const index = records.findIndex(rec => rec.id === id);

            if (index !== -1) {
                // 合併修改內容到本地快取
                records[index] = {
                    ...records[index],
                    ...changes
                };
                localStorage.setItem('records', JSON.stringify(records));
                
                // 套用當前篩選並重新渲染
                applyFilter();
                
                // 同步更新至雲端 Google Sheet (帶入當前完整 record 或異動)
                syncToSheet({ 
                    action: "update", 
                    record: { id: id, ...changes } 
                });
            }
        }


        // ==========================================
        //  非核心輔助函數與防護處理
        // ==========================================

        /**
         * 統計與資料視覺化面版更新函數 (Surgically Expanded to Support Visual Dashboard)
         * 職責：統計 localStorage 中所有學習卡片的數據，動態繪製「環狀進度圖(SVG)」與「優先級時數比例圖(HTML5/CSS3)」
         */
        function updateSummary() {
            const allRecords = loadData();
            const totalCount = allRecords.length;
            const activeRecords = allRecords.filter(r => r.status === 'active');
            const doneRecords = allRecords.filter(r => r.status === 'done');

            const activeCount = activeRecords.length;
            const doneCount = doneRecords.length;
            const activeHoursSum = activeRecords.reduce((sum, r) => sum + (Number(r.estimatedHours) || 0), 0);

            // 1. 更新原本的數字統計面板
            const summaryContainer = document.getElementById('statsSummary');
            if (summaryContainer) {
                summaryContainer.innerHTML = `
                    <div class="stats-card">
                        <div class="stats-label">
                            <i class="fa-solid fa-hourglass-half" style="color: var(--accent-active);"></i> 研習中
                        </div>
                        <div class="stats-value">${activeCount} 個</div>
                    </div>
                    <div class="stats-card">
                        <div class="stats-label">
                            <i class="fa-regular fa-clock" style="color: var(--primary);"></i> 待研總時數
                        </div>
                        <div class="stats-value">${activeHoursSum} hr</div>
                    </div>
                    <div class="stats-card">
                        <div class="stats-label">
                            <i class="fa-solid fa-graduation-cap" style="color: var(--accent-done);"></i> 已修得
                        </div>
                        <div class="stats-value">${doneCount} 個</div>
                    </div>
                `;
            }

            // 2. 進行視覺化數據分析與繪圖運算
            const donePercent = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;
            
            // 計算各優先級別的累計待研時數
            const highHours = activeRecords.filter(r => r.priority === 'high').reduce((sum, r) => sum + (Number(r.estimatedHours) || 0), 0);
            const medHours = activeRecords.filter(r => r.priority === 'medium').reduce((sum, r) => sum + (Number(r.estimatedHours) || 0), 0);
            const lowHours = activeRecords.filter(r => r.priority === 'low').reduce((sum, r) => sum + (Number(r.estimatedHours) || 0), 0);

            // 找出最高時數以便規劃相對百分比寬度
            const maxHours = Math.max(highHours, medHours, lowHours, 1);
            const highPercent = Math.round((highHours / maxHours) * 100);
            const medPercent = Math.round((medHours / maxHours) * 100);
            const lowPercent = Math.round((lowHours / maxHours) * 100);

            // 計算 SVG 圓環虛線偏移量 (半徑r=36, 周長2*PI*r ≈ 226)
            const circumference = 2 * Math.PI * 36;
            const strokeDashoffset = circumference - (donePercent / 100) * circumference;

            // 3. 更新視覺化圖表面板
            const visualDashboard = document.getElementById('visualDashboard');
            if (visualDashboard) {
                if (totalCount === 0) {
                    visualDashboard.style.display = 'none'; // 無資料時先隱藏圖表
                } else {
                    visualDashboard.style.display = 'grid';
                    visualDashboard.innerHTML = `
                        <!-- 左側：環狀進度圖 -->
                        <div class="chart-ring-wrapper">
                            <svg class="chart-ring-svg" width="90" height="90">
                                <circle class="chart-ring-bg" cx="45" cy="45" r="36" />
                                <circle class="chart-ring-progress" cx="45" cy="45" r="36" 
                                    style="stroke-dasharray: ${circumference}; stroke-dashoffset: ${strokeDashoffset};" />
                            </svg>
                            <div class="chart-ring-text">
                                ${donePercent}%
                                <span class="chart-ring-label">完成度</span>
                            </div>
                        </div>

                        <!-- 右側：優先級時數分佈條形圖 -->
                        <div class="bar-chart-container">
                            <div class="bar-chart-title">
                                <i class="fa-solid fa-chart-simple"></i> 優先級待研時數分佈
                            </div>
                            <!-- 高優先級 -->
                            <div class="bar-item">
                                <div class="bar-header">
                                    <span>🔥 高優先級</span>
                                    <span>${highHours} 小時</span>
                                </div>
                                <div class="bar-track">
                                    <div class="bar-fill bar-fill-high" style="width: ${highPercent}%;"></div>
                                </div>
                            </div>
                            <!-- 中優先級 -->
                            <div class="bar-item">
                                <div class="bar-header">
                                    <span>⚡ 中優先級</span>
                                    <span>${medHours} 小時</span>
                                </div>
                                <div class="bar-track">
                                    <div class="bar-fill bar-fill-medium" style="width: ${medPercent}%;"></div>
                                </div>
                            </div>
                            <!-- 低優先級 -->
                            <div class="bar-item">
                                <div class="bar-header">
                                    <span>🌱 低優先級</span>
                                    <span>${lowHours} 小時</span>
                                </div>
                                <div class="bar-track">
                                    <div class="bar-fill bar-fill-low" style="width: ${lowPercent}%;"></div>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }
        }

        // 重置篩選到「全部 (all)」
        function resetFilterToAll() {
            currentFilter = 'all';
            document.querySelectorAll('.filter-tab').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === 'all');
            });
            applyFilter();
        }

        // 控制篩選與渲染
        function applyFilter() {
            const records = loadData();
            if (currentFilter === 'all') {
                renderList(records);
            } else {
                const filtered = records.filter(rec => rec.status === currentFilter);
                renderList(filtered);
            }
        }

        // 單獨切換狀態
        function toggleStatus(id, currentStatus) {
            const nextStatus = currentStatus === 'active' ? 'done' : 'active';
            updateRecord(id, { status: nextStatus });
            showToast(nextStatus === 'done' ? '🎓 恭喜修得本門知識！' : '✍️ 事項已退回學習中！');
        }

        // 單獨刪除
        function handleDelete(id) {
            const records = loadData();
            const afterDeletion = records.filter(rec => rec.id !== id);
            localStorage.setItem('records', JSON.stringify(afterDeletion));
            showToast('🗑️ 已成功刪除該學習事項。');
            applyFilter();
        }

        // 時間格式化工具
        function formatDate(isoString) {
            if (!isoString) return '未知時間';
            try {
                const date = new Date(isoString);
                if (isNaN(date.getTime())) return '未知時間';
                const y = date.getFullYear();
                const m = String(date.getMonth() + 1).padStart(2, '0');
                const d = String(date.getDate()).padStart(2, '0');
                const hh = String(date.getHours()).padStart(2, '0');
                const mm = String(date.getMinutes()).padStart(2, '0');
                return `${y}/${m}/${d} ${hh}:${mm}`;
            } catch (err) {
                return '未知時間';
            }
        }

        // 安全跳脫 HTML 字元 (防範 XSS)
        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Toast 親民浮動訊息
        let toastTimer;
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.display = 'block';

            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
