學習清單備忘系統:index.html
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>study_list 學習探討與備忘系統</title>
    <!-- 引入 Google Fonts (Noto Sans TC) 與 FontAwesome 圖示 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 日系無印極簡美學變數 */
        :root {
            --bg-color: #f7f5f0;       /* 柔和暖白米色 */
            --card-bg: #ffffff;        /* 純白卡片 */
            --text-main: #3e3a36;      /* 深木炭灰 */
            --text-muted: #8c827a;     /* 溫和卡其灰 */
            --border-color: #e6e1da;   /* 淺泥灰邊框 */
            --primary: #4a5e6a;        /* 霧藍綠 */
            --primary-light: #f0f3f5;
            --accent-active: #df826c;  /* 暖珊瑚橘 (Active 狀態) */
            --accent-done: #8ba888;    /* 抹茶綠 (Done 狀態) */
            --shadow: 0 4px 12px rgba(62, 58, 54, 0.04);
            --shadow-hover: 0 10px 20px rgba(62, 58, 54, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 2.5rem 1rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* 標題區域 */
        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.05rem;
            font-weight: 400;
        }

        /* 左右雙欄結構 */
        .layout-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2.5rem;
        }

        @media (min-width: 850px) {
            .layout-grid {
                grid-template-columns: 360px 1fr;
            }
        }

        /* 卡片統一樣式 */
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            height: fit-content;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1.5px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        /* 表單元素樣式 */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #fafaf9;
            font-size: 0.95rem;
            color: var(--text-main);
            transition: all 0.25s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(74, 94, 106, 0.12);
        }

        .input-row {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 0.75rem;
        }

        /* 提交按鈕 */
        .btn-submit {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            color: #ffffff;
            background-color: var(--primary);
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(74, 94, 106, 0.15);
        }

        .btn-submit:hover {
            background-color: #3b4b55;
            transform: translateY(-1px);
        }

        /* 右側展示篩選與卡片牆工具列 */
        .toolbar {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            margin-bottom: 1.5rem;
        }

        @media (min-width: 600px) {
            .toolbar {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .toolbar-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* 極簡篩選標籤 */
        .filter-tabs {
            display: flex;
            background-color: #e9e4dc;
            padding: 0.3rem;
            border-radius: 30px;
            gap: 0.25rem;
        }

        .filter-tab {
            border: none;
            background: none;
            padding: 0.4rem 1.2rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.25s ease;
        }

        .filter-tab.active {
            background-color: var(--card-bg);
            color: var(--text-main);
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        /* 學習事項卡片展示牆 */
        .records-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.25rem;
        }

        @media (min-width: 650px) {
            .records-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .study-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
            overflow: hidden;
        }

        .study-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        /* 事項狀態邊框視覺提示 */
        .study-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            background-color: var(--accent-active);
        }

        .study-card.is-done::before {
            background-color: var(--accent-done);
        }

        /* 卡片頭部：標籤、時間 */
        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .tag-group {
            display: flex;
            gap: 0.4rem;
        }

        .tag {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
        }

        .tag-priority-high { background-color: #fee2e2; color: #b91c1c; }
        .tag-priority-medium { background-color: #fef3c7; color: #d97706; }
        .tag-priority-low { background-color: #f0fdf4; color: #15803d; }

        .tag-status-active {
            background-color: #fff4f2;
            color: var(--accent-active);
            border: 1px solid #ffd4cc;
        }

        .tag-status-done {
            background-color: #f1f8f0;
            color: var(--accent-done);
            border: 1px dashed #cde2cc;
        }

        .card-time {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        /* 核心內文 */
        .card-body {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.75rem;
            word-break: break-all;
            line-height: 1.5;
        }

        /* 註記 */
        .card-remarks {
            font-size: 0.88rem;
            color: var(--text-muted);
            background-color: #fafafa;
            border-radius: 6px;
            padding: 0.6rem;
            border-left: 3px solid var(--border-color);
            margin-bottom: 1.25rem;
            font-style: italic;
            word-break: break-all;
        }

        /* 學習時數資訊 */
        .card-info {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: auto;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-weight: 500;
        }

        .card-info i {
            color: var(--primary);
        }

        /* 底部控制按鈕 */
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 0.85rem;
        }

        .btn-action {
            background: none;
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            transition: all 0.2s ease;
        }

        .btn-toggle {
            color: var(--primary);
            background-color: #fafafa;
        }

        .btn-toggle:hover {
            background-color: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .btn-delete {
            color: #c62828;
            border: none;
        }

        .btn-delete:hover {
            background-color: #ffebee;
            color: #b71c1c;
        }

        /* 完成狀態 (done) 卡片樣式 */
        .study-card.is-done .card-body {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .study-card.is-done {
            background-color: #fbfbf9;
            opacity: 0.85;
        }

        /* 滿版空清單 */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4.5rem 2rem;
            color: var(--text-muted);
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 2px dashed var(--border-color);
        }

        .empty-state-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            opacity: 0.6;
            color: var(--primary);
        }

        /* 彈出訊息提示 */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background-color: var(--text-main);
            color: #ffffff;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            z-index: 1000;
            font-size: 0.9rem;
            font-weight: bold;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateY(1.5rem); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 標頭 -->
        <header>
            <h1>📚 study_list</h1>
            <p>簡單、專注的學習探討與備考事項備忘小幫手</p>
        </header>

        <!-- 主體網格 -->
        <main class="layout-grid">
            
            <!-- 左欄：研習事項新增表單 -->
            <section class="card">
                <div class="card-title">
                    <i class="fa-solid fa-feather-pointed"></i> 記下研習任務
                </div>
                <form id="studyForm" novalidate>
                    
                    <!-- 1. waiting to do (必填) -->
                    <div class="form-group">
                        <label for="inputWaiting">學習備忘事項 * (waiting to do)</label>
                        <input type="text" id="inputWaiting" class="form-control" placeholder="例：詳讀 React Hooks 原始碼並手寫筆記" required autocomplete="off">
                    </div>

                    <!-- 2. 學習優先權 & 預估時間 -->
                    <div class="form-group">
                        <div class="input-row">
                            <div>
                                <label for="selectPriority">優先權 *</label>
                                <select id="selectPriority" class="form-control" required>
                                    <option value="high">🔥 高</option>
                                    <option value="medium" selected>⚡ 中</option>
                                    <option value="low">🌱 低</option>
                                </select>
                            </div>
                            <div>
                                <label for="inputHours">預估時數 (小時) *</label>
                                <input type="number" id="inputHours" class="form-control" min="1" max="100" value="2" required>
                            </div>
                        </div>
                    </div>

                    <!-- 3. 補充說明 -->
                    <div class="form-group">
                        <label for="inputRemarks">補充註記與吐槽 (選填)</label>
                        <textarea id="inputRemarks" class="form-control" style="resize: vertical; min-height: 80px;" placeholder="例：希望下午前能徹底看懂，別再分心滑手機了！"></textarea>
                    </div>

                    <!-- 提交按鈕 -->
                    <button type="submit" class="btn-submit">
                        <i class="fa-solid fa-folder-plus"></i> 新增研習事項
                    </button>
                </form>
            </section>

            <!-- 右欄：景點備忘卡片牆 -->
            <section style="display: flex; flex-direction: column;">
                
                <!-- 篩選控制列 -->
                <div class="toolbar">
                    <div class="toolbar-title">
                        <i class="fa-solid fa-book-open"></i> 研習清單
                    </div>
                    <div class="filter-tabs" id="filterTabs">
                        <button class="filter-tab active" data-filter="all">全部</button>
                        <button class="filter-tab" data-filter="active">研習中</button>
                        <button class="filter-tab" data-filter="done">已修得</button>
                    </div>
                </div>

                <!-- 備忘卡片牆 -->
                <div id="recordsContainer" class="records-grid">
                    <!-- 由 JavaScript 動態繪製 -->
                </div>
            </section>

        </main>
    </div>

    <!-- 提示框 -->
    <div id="toast" class="toast"></div>

    <script>
        // --- 全域變數狀態管制 ---
        let currentFilter = 'all';

        // 頁面初次載入
        document.addEventListener('DOMContentLoaded', () => {
            initApp();
        });

        // 初始化系統元件
        function initApp() {
            // 自載入儲存庫
            const initialRecords = loadData();
            renderList(initialRecords);

            // 監聽新增表單
            const form = document.getElementById('studyForm');
            form.addEventListener('submit', onFormSubmit);

            // 監聽篩選按鈕群組
            const filterTabs = document.getElementById('filterTabs');
            filterTabs.addEventListener('click', (e) => {
                if (e.target.classList.contains('filter-tab')) {
                    document.querySelectorAll('.filter-tab').forEach(btn => btn.classList.remove('active'));
                    e.target.classList.add('active');

                    currentFilter = e.target.dataset.filter;
                    applyFilter();
                }
            });
        }

        // 當表單提交時
        function onFormSubmit(e) {
            e.preventDefault();

            const waitingInput = document.getElementById('inputWaiting');
            const prioritySelect = document.getElementById('selectPriority');
            const hoursInput = document.getElementById('inputHours');
            const remarksInput = document.getElementById('inputRemarks');

            // 取值與修飾
            const waitingToDo = waitingInput.value.trim();
            const priority = prioritySelect.value;
            const estimatedHours = parseInt(hoursInput.value, 10);
            const remarks = remarksInput.value.trim();

            // 必填欄位驗證
            if (!waitingToDo) {
                showToast('請輸入待辦學習事項內容！');
                waitingInput.focus();
                return;
            }
            if (isNaN(estimatedHours) || estimatedHours < 1) {
                showToast('預估學習時數必須為大於或等於 1 的數字！');
                hoursInput.focus();
                return;
            }

            const formData = {
                waitingToDo: waitingToDo,
                priority: priority,
                estimatedHours: estimatedHours,
                remarks: remarks
            };

            // 依技術要求建立新紀錄
            createRecord(formData);
            
            // 清空表單
            document.getElementById('studyForm').reset();
            document.getElementById('selectPriority').value = 'medium';
            document.getElementById('inputHours').value = '2';
            
            showToast('🌱 成功加入一筆全新的學習項目！');
        }


        // ==========================================
        //  技術要求：指定規格之核心函數 (嚴格拆分)
        // ==========================================

        /**
         * 1. createRecord(formData)
         * 職責：根據表單內容建立一筆新 record object。
         * @param {Object} formData 包含 waitingToDo, priority, estimatedHours, remarks 的暫存物件
         */
        function createRecord(formData) {
            // 生成獨特專用識別 ID
            const uniqueId = 'study_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);

            const newRecord = {
                id: uniqueId,
                createdAt: new Date().toISOString(), // 依規格使用 new Date().toISOString()
                status: 'active', // 預設 active
                waitingToDo: formData.waitingToDo,
                priority: formData.priority,
                estimatedHours: Number(formData.estimatedHours),
                remarks: formData.remarks
            };

            saveData(newRecord);
        }

        /**
         * 2. saveData(record)
         * 職責：只負責新增一筆 record 到 records array，然後寫入 localStorage。
         * @param {Object} record 單筆待儲存的學習紀錄物件
         */
        function saveData(record) {
            const records = loadData();
            records.push(record);
            localStorage.setItem('records', JSON.stringify(records));

            // 優化點：重設篩選為「全部」，確保新增的 Active 項目能立刻在畫面上被看見
            resetFilterToAll();
        }

        /**
         * 3. loadData()
         * 職責：從 localStorage 讀取 records array；沒有資料就回傳 []。
         * @returns {Array} 學習紀錄陣列
         */
        function loadData() {
            const rawData = localStorage.getItem('records');
            try {
                return rawData ? JSON.parse(rawData) : [];
            } catch (err) {
                console.error("讀取歷史儲存檔失敗：", err);
                return [];
            }
        }

        /**
         * 4. renderList(recordsToShow)
         * 職責：接收過濾後的 records 陣列，負責乾淨地渲染到畫面上。
         * @param {Array} recordsToShow 要渲染到畫面的紀錄陣列
         */
        function renderList(recordsToShow) {
            const container = document.getElementById('recordsContainer');
            container.innerHTML = ''; // 清空先前的內容

            // 倘若為空，顯示提示頁面
            if (!recordsToShow || recordsToShow.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon"><i class="fa-solid fa-mug-hot"></i></div>
                        <h3>當前無研習任務</h3>
                        <p>現在正是放鬆或寫下新一項學習計畫的好時機！</p>
                    </div>
                `;
                return;
            }

            // 排版：新新增的事項顯示在最前方（建立時間降序）
            const sortedRecords = [...recordsToShow].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

            sortedRecords.forEach(record => {
                const card = document.createElement('div');
                card.className = `study-card ${record.status === 'done' ? 'is-done' : ''}`;

                // 優先權與狀態標籤轉換
                const priorityText = record.priority === 'high' ? '高優先度' : record.priority === 'medium' ? '中優先度' : '低優先度';
                
                // 狀態戳章與對應按鈕文字 (XXX_STATUS_DONE_TEXT)
                const statusBadgeHtml = record.status === 'done'
                    ? `<span class="tag tag-status-done"><i class="fa-solid fa-graduation-cap"></i> 🎓 已修得 (Done)</span>`
                    : `<span class="tag tag-status-active"><i class="fa-solid fa-pencil"></i> ✍️ 研習中 (Active)</span>`;

                const toggleBtnText = record.status === 'active'
                    ? '<i class="fa-solid fa-square-check"></i> 標記已完成'
                    : '<i class="fa-solid fa-rotate-left"></i> 恢復 Active';

                // 防止 XSS 攻擊的內容轉換
                const safeWaiting = escapeHtml(record.waitingToDo);
                const safeRemarks = escapeHtml(record.remarks);

                card.innerHTML = `
                    <div class="card-meta">
                        <div class="tag-group">
                            <span class="tag tag-priority-${record.priority}">${priorityText}</span>
                            ${statusBadgeHtml}
                        </div>
                        <span class="card-time">${formatDate(record.createdAt)}</span>
                    </div>

                    <div class="card-body">${safeWaiting}</div>
                    
                    ${record.remarks ? `<div class="card-remarks">${safeRemarks}</div>` : ''}

                    <div class="card-info">
                        <i class="fa-regular fa-clock"></i>
                        <span>預估時數：${record.estimatedHours} 小時</span>
                    </div>

                    <div class="card-footer">
                        <button class="btn-action btn-toggle" onclick="toggleStatus('${record.id}', '${record.status}')">
                            ${toggleBtnText}
                        </button>
                        <button class="btn-action btn-delete" onclick="handleDelete('${record.id}')" title="刪除本筆事項">
                            <i class="fa-solid fa-trash-can"></i> 刪除
                        </button>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        /**
         * 5. updateRecord(id, changes)
         * 職責：更新指定 id 的單筆 record，並重新寫入 localStorage。
         * @param {String} id 唯一識別碼
         * @param {Object} changes 包含要修改鍵值的變更對象
         */
        function updateRecord(id, changes) {
            const records = loadData();
            const index = records.findIndex(rec => rec.id === id);

            if (index !== -1) {
                // 合併修改內容
                records[index] = {
                    ...records[index],
                    ...changes
                };
                localStorage.setItem('records', JSON.stringify(records));
                
                // 更新後，套用當前篩選並重新渲染
                applyFilter();
            }
        }


        // ==========================================
        //  非核心輔助函數與防護處理
        // ==========================================

        // 重置篩選到「全部 (all)」
        function resetFilterToAll() {
            currentFilter = 'all';
            document.querySelectorAll('.filter-tab').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === 'all');
            });
            applyFilter();
        }

        // 控制篩選與渲染
        function applyFilter() {
            const records = loadData();
            if (currentFilter === 'all') {
                renderList(records);
            } else {
                const filtered = records.filter(rec => rec.status === currentFilter);
                renderList(filtered);
            }
        }

        // 單獨切換狀態
        function toggleStatus(id, currentStatus) {
            const nextStatus = currentStatus === 'active' ? 'done' : 'active';
            updateRecord(id, { status: nextStatus });
            showToast(nextStatus === 'done' ? '🎓 恭喜修得本門知識！' : '✍️ 事項已退回學習中！');
        }

        // 單獨刪除
        function handleDelete(id) {
            const records = loadData();
            const afterDeletion = records.filter(rec => rec.id !== id);
            localStorage.setItem('records', JSON.stringify(afterDeletion));
            showToast('🗑️ 已成功刪除該學習事項。');
            applyFilter();
        }

        // 時間格式化工具
        function formatDate(isoString) {
            if (!isoString) return '未知時間';
            try {
                const date = new Date(isoString);
                if (isNaN(date.getTime())) return '未知時間';
                const y = date.getFullYear();
                const m = String(date.getMonth() + 1).padStart(2, '0');
                const d = String(date.getDate()).padStart(2, '0');
                const hh = String(date.getHours()).padStart(2, '0');
                const mm = String(date.getMinutes()).padStart(2, '0');
                return `${y}/${m}/${d} ${hh}:${mm}`;
            } catch (err) {
                return '未知時間';
            }
        }

        // 安全跳脫 HTML 字元 (防範 XSS)
        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Toast 親民浮動訊息
        let toastTimer;
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.display = 'block';

            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
